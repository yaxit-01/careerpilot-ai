<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#080d19"/>
    </linearGradient>

    <!-- Purple Lightning Gradient -->
    <linearGradient id="purpleBolt" x1="16" y1="8" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Mint Green Accent Gradient -->
    <linearGradient id="mintAccent" x1="20" y1="30" x2="48" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#63e6be"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow filters for crisp contrast -->
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#8b5cf6" flood-opacity="0.45"/>
    </filter>
    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#63e6be" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark navy squircle background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#263449" stroke-width="2"/>

  <!-- Upper Purple Lightning Bolt -->
  <path d="M38 7L18 32H31L26 43L37 27H29L38 7Z" fill="url(#purpleBolt)" filter="url(#boltGlow)"/>

  <!-- Lower Mint-Green Energy Strike & Tip -->
  <path d="M31 32L23 57L46 27H33L37 20L31 32Z" fill="url(#mintAccent)" filter="url(#mintGlow)"/>

  <!-- Brand AI Sparkle in Mint-Green -->
  <path d="M49 9C49 12.5 51.5 15 55 15C51.5 15 49 17.5 49 21C49 17.5 46.5 15 43 15C46.5 15 49 12.5 49 9Z" fill="#63e6be"/>
</svg>